<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a3a5c">
  <title>원재료 육안검사 일지 — ㈜위드프레쉬</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-size: 14px; background: #f0f2f5; color: #222; }
    .container { max-width: 600px; margin: 0 auto; padding: 14px 14px 40px; }

    .page-header { text-align: center; padding: 18px 0 14px; }
    .page-header h1 { font-size: 19px; font-weight: bold; color: #1a3a5c; letter-spacing: 1px; }
    .page-header p { font-size: 12px; color: #888; margin-top: 3px; }

    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 5px rgba(0,0,0,.08); }
    .section-title { font-size: 13px; font-weight: bold; color: #1a3a5c; border-left: 4px solid #1a3a5c; padding-left: 8px; margin-bottom: 14px; }
    .section-sub { font-size: 11px; color: #888; margin-left: 6px; font-weight: normal; }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
    .field input, .field select, .field textarea { width: 100%; padding: 10px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #1a3a5c; outline: none; }
    .field.full { grid-column: 1/-1; }
    .qty-row { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

    /* 점검항목 행 */
    .chk-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .chk-row:last-of-type { border-bottom: none; }
    .chk-label { font-size: 13px; color: #333; line-height: 1.4; }
    .chk-label small { display: block; font-size: 11px; color: #999; margin-top: 2px; }
    .ox-btns { display: flex; gap: 4px; }
    .ox-btn { width: 40px; padding: 8px 0; border: 1.5px solid #ddd; border-radius: 6px; font-size: 13px; font-weight: bold; text-align: center; cursor: pointer; background: #fff; font-family: inherit; color: #999; }
    .ox-btn.ok.active { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; }
    .ox-btn.ng.active { background: #ffebee; border-color: #c62828; color: #c62828; }
    .ox-btn.na.active { background: #eceff1; border-color: #78909c; color: #455a64; }

    .temp-row { display: grid; grid-template-columns: 1fr 130px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .temp-wrap { position: relative; }
    .temp-input { width: 100%; padding: 10px 26px 10px 10px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center; font-family: inherit; -moz-appearance: textfield; }
    .temp-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .temp-input:focus { border-color: #1a3a5c; outline: none; }
    .temp-unit { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #aaa; pointer-events: none; }

    .result-btns { display: flex; gap: 8px; }
    .res-btn { flex: 1; padding: 14px 4px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; background: #fff; font-family: inherit; color: #888; }
    .res-btn.ok.active { background: #e8f5e9; border-color: #2e7d32; color: #2e7d32; }
    .res-btn.ng.active { background: #ffebee; border-color: #c62828; color: #c62828; }

    .alert-section { display: none; }
    .alert-section.visible { display: block; }
    .alert-section textarea { width: 100%; padding: 10px; border: 1.5px solid #ffcdd2; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 70px; background: #fff8f8; }
    .alert-section textarea:focus { border-color: #c62828; outline: none; }

    /* 사진 첨부 */
    .photo-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .btn-photo { display: inline-block; padding: 12px 18px; background: #2e5f8a; color: #fff; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .btn-photo:active { background: #1a3a5c; }
    .photo-count { font-size: 12px; color: #888; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-top: 12px; }
    .photo-thumb { position: relative; border: 1.5px solid #ddd; border-radius: 8px; overflow: hidden; background: #fafafa; }
    .photo-thumb img { width: 100%; height: 104px; object-fit: cover; display: block; }
    .photo-del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; line-height: 1; cursor: pointer; font-family: inherit; }
    .photo-empty { font-size: 12px; color: #bbb; padding: 14px 0; text-align: center; border: 1.5px dashed #e0e0e0; border-radius: 8px; margin-top: 12px; }
    .photo-hint { font-size: 11px; color: #999; margin-top: 8px; line-height: 1.5; }

    .legend { font-size: 11px; color: #888; margin-top: 10px; }

    .btn-save { width: 100%; padding: 16px; background: #1a3a5c; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: inherit; letter-spacing: 1px; margin-top: 4px; }
    .btn-save:active { background: #0f2540; }
    .btn-save:disabled { background: #aab; }

    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); max-width: 90%; background: #333; color: #fff; padding: 12px 22px; border-radius: 24px; font-size: 13.5px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 999; }
    .toast.show { opacity: 1; }
    .toast.success { background: #2e7d32; }
    .toast.error { background: #c62828; }

    @media print {
      body { background: #fff; font-size: 9pt; }
      .container { max-width: 100%; padding: 0; }
      .card { box-shadow: none; border: 1px solid #ccc; border-radius: 0; margin-bottom: 6px; padding: 8px; }
      .btn-save, .toast, .btn-photo, .photo-del { display: none !important; }
      .photo-thumb img { height: auto; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>원재료 육안검사 일지</h1>
    <p>㈜위드프레쉬 · 입고 건별 작성</p>
  </div>

  <!-- 입고정보 -->
  <div class="card">
    <div class="section-title">■ 입고정보</div>
    <div class="info-grid">
      <div class="field full"><label>입고일자</label><input type="date" id="date"></div>
      <div class="field full"><label>품명</label><input type="text" id="item_name" placeholder="예) 냉동 꽃게"></div>
      <div class="field full"><label>구입처명</label><input type="text" id="supplier" placeholder="예) ○○수산"></div>
      <div class="field full">
        <label>소비기한 / 제조년월일 / 품질유지기한</label>
        <input type="text" id="expiry" placeholder="예) 소비기한 2027-05-01">
      </div>
      <div class="field full">
        <label>입고량</label>
        <div class="qty-row">
          <input type="number" step="0.1" min="0" inputmode="decimal" id="qty_value" placeholder="수량 입력">
          <select id="qty_unit">
            <option value="kg" selected>kg</option>
            <option value="박스">박스</option>
            <option value="개">개</option>
            <option value="톤">톤</option>
          </select>
        </div>
      </div>
      <div class="field"><label>점검자</label>
        <select id="inspector">
          <option value="">선택하세요</option>
          <option value="전혜진 계장">전혜진 계장</option>
          <option value="김현우 부장">김현우 부장</option>
        </select>
      </div>
      <div class="field"><label>승인자</label>
        <select id="confirmer">
          <option value="">선택하세요</option>
          <option value="김현우 부장">김현우 부장</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 검사항목 -->
  <div class="card">
    <div class="section-title">■ 육안검사 항목</div>
    <div id="check-list"></div>
    <div class="temp-row">
      <div class="chk-label">차량온도</div>
      <div class="temp-wrap">
        <input class="temp-input" type="number" step="0.1" inputmode="decimal" id="vehicle_temp" placeholder="—">
        <span class="temp-unit">℃</span>
      </div>
    </div>
    <div class="legend">범례 — 적합 ○ · 부적합 × · 해당없음 −</div>
  </div>

  <!-- 차량 또는 제품 품온 온도관리 (사진) -->
  <div class="card">
    <div class="section-title">■ 차량 또는 제품 품온 온도관리 <span class="section-sub">온도계 화면을 촬영해서 첨부</span></div>
    <div class="temp-row" style="border-bottom:none;padding-top:0;">
      <div class="chk-label">측정 품온 <small>(사진과 함께 수치도 기록하면 조회에서 바로 확인됩니다)</small></div>
      <div class="temp-wrap">
        <input class="temp-input" type="number" step="0.1" inputmode="decimal" id="product_temp" placeholder="—">
        <span class="temp-unit">℃</span>
      </div>
    </div>
    <div class="photo-actions">
      <label class="btn-photo">📷 사진 촬영 / 선택
        <input type="file" accept="image/*" capture="environment" multiple hidden onchange="addPhotos(this,'temp')">
      </label>
      <span class="photo-count" id="cnt-temp">0 / 4장</span>
    </div>
    <div id="grid-temp"></div>
    <div class="photo-hint">※ 촬영한 사진은 자동으로 압축(가로 900px)되어 저장됩니다. 최대 4장.</div>
  </div>

  <!-- 적합여부 -->
  <div class="card">
    <div class="section-title">■ 적합여부 (종합판정)</div>
    <div class="result-btns">
      <button type="button" class="res-btn ok" id="res_ok" onclick="setResult('ok')">적 합</button>
      <button type="button" class="res-btn ng" id="res_ng" onclick="setResult('ng')">부적합</button>
    </div>
  </div>

  <!-- 부적합 시 조치 -->
  <div class="card alert-section" id="alert-section">
    <div class="section-title">■ 부적합 시 조치 내용</div>
    <textarea id="action_note" placeholder="부적합 사항 및 조치 내용을 입력하세요"></textarea>
  </div>

  <button class="btn-save" id="btn-save" onclick="saveRecord()">저 장 하 기</button>
</div>
<div class="toast" id="toast"></div>

<script>
// =============================================
const FIREBASE_URL = 'https://withfresh-haccp-default-rtdb.asia-southeast1.firebasedatabase.app';
// =============================================

// ── 검사항목 (실물 "원재료 육안검사 일지" 양식 순서와 동일) ──
const CHECKS = [
  { id: 'vehicle_state', label: '차량상태' },
  { id: 'packaging',     label: '포장상태' },
  { id: 'appearance',    label: '성상 — 외관' },
  { id: 'color',         label: '성상 — 색상' },
  { id: 'smell',         label: '성상 — 냄새' },
  { id: 'foreign',       label: '이물혼입' },
  { id: 'labeling',      label: '표시기준', sub: '알러지 유발물질 포함 여부' },
];

// ── 사진 첨부 공통 ────────────────────────────────────────
const MAX_PHOTOS = 4;
const PHOTOS = {};

function compressImage(file, maxSide, quality) {
  maxSide = maxSide || 900; quality = quality || 0.62;
  return new Promise((resolve, reject) => {
    if (!file.type || file.type.indexOf('image/') !== 0) { reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read fail'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode fail'));
      img.onload = () => {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = quality, url = c.toDataURL('image/jpeg', q);
        while (url.length > 900 * 1024 && q > 0.35) { q -= 0.12; url = c.toDataURL('image/jpeg', q); }
        resolve(url);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addPhotos(input, key) {
  const files = Array.from(input.files || []);
  input.value = '';
  if (!files.length) return;
  PHOTOS[key] = PHOTOS[key] || [];
  let skipped = 0;
  for (const f of files) {
    if (PHOTOS[key].length >= MAX_PHOTOS) { skipped++; continue; }
    try { PHOTOS[key].push(await compressImage(f)); }
    catch (e) { console.warn(e); showToast('이미지를 불러오지 못했습니다.', 'error'); }
  }
  if (skipped) showToast(`사진은 최대 ${MAX_PHOTOS}장까지 첨부됩니다.`, 'error');
  renderPhotos(key);
}

function removePhoto(key, idx) {
  if (!PHOTOS[key]) return;
  PHOTOS[key].splice(idx, 1);
  renderPhotos(key);
}

function renderPhotos(key) {
  const list = PHOTOS[key] || [];
  const grid = document.getElementById('grid-' + key);
  const cnt = document.getElementById('cnt-' + key);
  if (cnt) cnt.textContent = `${list.length} / ${MAX_PHOTOS}장`;
  if (!grid) return;
  if (!list.length) { grid.className = ''; grid.innerHTML = '<div class="photo-empty">첨부된 사진이 없습니다</div>'; return; }
  grid.className = 'photo-grid';
  grid.innerHTML = list.map((src, i) => `
    <div class="photo-thumb">
      <img src="${src}" alt="첨부 ${i + 1}">
      <button type="button" class="photo-del" onclick="removePhoto('${key}',${i})" aria-label="삭제">✕</button>
    </div>`).join('');
}

// ── 초기화 ────────────────────────────────────────────────
document.getElementById('date').value = todayStr();
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function renderChecks() {
  document.getElementById('check-list').innerHTML = CHECKS.map(c => `
    <div class="chk-row">
      <div class="chk-label">${c.label}${c.sub ? `<small>${c.sub}</small>` : ''}</div>
      <div class="ox-btns">
        <button type="button" class="ox-btn ok" id="ok-${c.id}" onclick="setOX('${c.id}','ok')">○</button>
        <button type="button" class="ox-btn ng" id="ng-${c.id}" onclick="setOX('${c.id}','ng')">×</button>
        <button type="button" class="ox-btn na" id="na-${c.id}" onclick="setOX('${c.id}','na')">−</button>
      </div>
    </div>`).join('');
}

function setOX(id, state) {
  ['ok', 'ng', 'na'].forEach(s => {
    document.getElementById(`${s}-${id}`).classList.toggle('active', s === state);
  });
  // 부적합이 하나라도 있으면 종합판정을 부적합으로 자동 제안
  if (state === 'ng') setResult('ng');
}

function getOX(id) {
  if (document.getElementById(`ok-${id}`).classList.contains('active')) return 'ok';
  if (document.getElementById(`ng-${id}`).classList.contains('active')) return 'ng';
  if (document.getElementById(`na-${id}`).classList.contains('active')) return 'na';
  return null;
}

function setResult(state) {
  document.getElementById('res_ok').classList.toggle('active', state === 'ok');
  document.getElementById('res_ng').classList.toggle('active', state === 'ng');
  document.getElementById('alert-section').classList.toggle('visible', state === 'ng');
}

function getResult() {
  if (document.getElementById('res_ok').classList.contains('active')) return 'ok';
  if (document.getElementById('res_ng').classList.contains('active')) return 'ng';
  return null;
}

function numVal(id) {
  const el = document.getElementById(id);
  if (!el || el.value === '') return null;
  const n = parseFloat(el.value);
  return isNaN(n) ? null : n;
}

// ── Firebase 저장 ─────────────────────────────────────────
async function saveRecord() {
  const date = document.getElementById('date').value;
  const itemName = document.getElementById('item_name').value.trim();
  const supplier = document.getElementById('supplier').value.trim();
  const inspector = document.getElementById('inspector').value;
  const confirmer = document.getElementById('confirmer').value;
  const result = getResult();

  if (!date) { showToast('입고일자를 입력하세요.', 'error'); return; }
  if (!itemName) { showToast('품명을 입력하세요.', 'error'); return; }
  if (!supplier) { showToast('구입처명을 입력하세요.', 'error'); return; }
  if (!inspector) { showToast('점검자를 선택하세요.', 'error'); return; }
  if (!confirmer) { showToast('승인자를 선택하세요.', 'error'); return; }
  if (!result) { showToast('적합여부를 선택하세요.', 'error'); return; }

  const checks = {};
  CHECKS.forEach(c => { checks[c.id] = { label: c.label, value: getOX(c.id) }; });

  const payload = {
    meta: {
      date, inspector, confirmer,
      created_at: Date.now(),
      reviewed: false, reviewed_at: null
    },
    item_name: itemName,
    supplier,
    expiry: document.getElementById('expiry').value.trim(),
    qty_value: numVal('qty_value'),
    qty_unit: document.getElementById('qty_unit').value,
    checks,
    vehicle_temp: numVal('vehicle_temp'),
    product_temp: numVal('product_temp'),
    photos: { temp: PHOTOS.temp || [] },
    result,
    action_note: result === 'ng' ? document.getElementById('action_note').value.trim() : '',
    has_alert: result === 'ng'
  };

  const [year, month] = date.split('-');
  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = '저장 중...';

  try {
    const res = await fetch(
      `${FIREBASE_URL}/material_logs/${year}/${month}.json`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const photoCnt = (PHOTOS.temp || []).length;
    showToast(`저장 완료! ✓${photoCnt ? `  (품온사진 ${photoCnt}장 포함)` : ''}`, 'success');
    setTimeout(() => location.reload(), 2200);
  } catch (e) {
    console.error(e);
    showToast('저장 실패 — 네트워크를 확인하세요.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = '저 장 하 기';
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type || ''}`;
  setTimeout(() => { t.className = 'toast'; }, 3500);
}

// ── 실행 ──────────────────────────────────────────────────
renderChecks();
renderPhotos('temp');
setResult('ok');
</script>
</body>
</html>
